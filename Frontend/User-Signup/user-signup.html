<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TerraceGarden</title>
    <link rel="stylesheet" href="user-signup.css">
</head>
<body>
    <div class="floating-emoji">&#127793;</div>
    <div class="floating-emoji">&#127804;</div>
    <div class="floating-emoji">&#127826;</div>
    <div class="floating-emoji">&#127808;</div>
    <div class="floating-emoji">&#127813;</div>
    <div class="floating-emoji">&#129388;</div>
    <div class="floating-emoji">&#127815;</div>

    <div class="container">
        <h2 id="signup-heading">Signup</h2>
        <form action="/TerraceGarden/User/signup" method="POST">
            <div>
                <input type="email" name="email" placeholder="Email" required/>
                <input type="password" name="password" placeholder="Password" required/>
                <input type="firstName" name="firstName" placeholder="FirstName" required/>
                <input type="lastName" name="lastName" placeholder="LastName" required/>
            </div>
            <div>
                <button class="Signup-btn">Signup</button>
            </div>
        </form>
        <div class="google-btn">
            <img src="https://cdn-icons-png.flaticon.com/512/281/281764.png" alt="Google Logo" />
            Continue with Google
        </div>
        <div>
            <p>Already have an account<a href=""> Signin</a></p>
        </div>
    </div>
    <script src="user-signup.js"></script>
</body>
</html>
